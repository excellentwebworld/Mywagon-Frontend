<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MYVAGON — Shipper panel dashboard and shipment management interface" />
    <meta name="theme-color" content="#6C3AED" />
    <title>MYVAGON — Shipper Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      #boot-loader {
        position: fixed;
        inset: 0;
        z-index: 999998;
        display: flex;
        align-items: center;
        justify-content: center;
        background: transparent;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        transition: opacity 0.25s ease, visibility 0.25s ease;
      }
      #boot-loader.boot-loader--hide {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #boot-loader .boot-spinner {
        width: 48px;
        height: 48px;
        border: 3px solid rgba(255, 255, 255, 0.2);
        border-top-color: #fff;
        border-right-color: #fff;
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body class="antialiased">
    <div id="boot-loader" aria-hidden="false" aria-busy="true" aria-label="Loading">
      <div class="boot-spinner"></div>
    </div>
    <div id="root"></div>
    <script>
      window.setTimeout(function () {
        var el = document.getElementById('boot-loader');
        if (el) {
          el.classList.add('boot-loader--hide');
          el.setAttribute('aria-hidden', 'true');
        }
      }, 8000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
